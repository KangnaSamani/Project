<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href=https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQCGTE1RClHhqqJlfW4jPnFvFUonttzOicBPLxQ_-Mucw&s=10/>
    <title>Online Shopping site in India: Shop Online for Mobiles, Books, Watches, Shoes and More - Amazon.in</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header class="header">
        <div class="navbar">
            <div class="nav-logo border">
                <div class="logo"></div>
        </div>

            <div class="nav-address border">
                <p class="add-first">Deliver to</p>
                <div class="add-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="add-second">India</p>
                </div>
            </div>
        <div class="nav-search">
            <select class="search-select">
                <option>All</option>
            </select>
            <input placeholder="Search Amazon" class="search-input">
            <div class="search-icon">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>

        <div class="nav-signin border">
            <p><span>Hello, sign in</span></p>
            <p class="nav-second">Account & Lists</p>
        </div>

        <div class="nav-return border">
            <p><span>Returns</span></p>
            <p class="nav-second">& Orders</p>
        </div>

        <div class="nav-cart border">
            <i class="fa-solid fa-cart-shopping"></i>
            Cart
        </div>
        </div>

        <div class="panel">
            <div class="panel-all border">
                <i class="fa-solid fa-bars"></i>
                All
            </div>
            <div class="panel-ops">
                <p class="border">Fresh</p>
                <p class="border">Amazon Pay</p>
                <p class="border">Mobiles</p>
                <p class="border">Today's Deals</p>
                <p class="border">Coupons</p>
                <p class="border">Flights</p>
                <p class="border">Electronics</p>
                <p class="border">Computers</p>
                <p class="border">New Releases</p>
            </div>
            <div class="panel-deals border">
                Great Indian Festival | Live Now
            </div>
        </div>

        <div class="deals-card">
            <h2 class="deals-title">Deals on<br>Amazon Devices</h2>
            <div class="grid-container">
                <div class="grid-item">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsBIaTbPoTiaSYIo63DC1Quv6vZ-5aNabK0C2z77T_ag&s=10">
                </div>
                <div class="grid-item">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQMghRO9qkQjvXKgFkOOgb7WmO2oqkY3iAtAF3JUIm7RA&s">
                </div>
                <div class="grid-item">
                    <img src="https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcQOIJNaXXftzuIJkkekHfhjcMaqHknIGQq19wxSJxLxV1kXBohfbmO5HacJB07Oqoc7RvfwvBpyq5mym0fhkBALnJ1GArBoVysdK4KqHET_L27Azee-vzzBTHLx3MamLd0p1iC-ogPdHw&usqp=CAc">
                </div>
                <div class="grid-item">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSV6buk3izEjb2cial8e1KklJXf1ia-9KHNpxxWC_o5lA&s=10">
                </div>
            </div>
        </div>

    </header>
</body>
</html>
